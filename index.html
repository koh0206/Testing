<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Hub — Personal & Team To-Do Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div>
        <p class="eyebrow">Task Management Portal</p>
        <h1>Task Hub</h1>
        <p class="subtitle">Plan your day, coordinate with your team, and ship work without losing track.</p>
      </div>
      <div class="stats" aria-live="polite">
        <div class="stat-card">
          <p class="stat-label">Open</p>
          <p class="stat-value" id="stat-open">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">In Progress</p>
          <p class="stat-value" id="stat-progress">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Done</p>
          <p class="stat-value" id="stat-done">0</p>
        </div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="mine" role="tab" aria-selected="true">My Tasks</button>
      <button class="tab" data-view="team" role="tab" aria-selected="false">Team Tasks</button>
      <button class="tab" data-view="all" role="tab" aria-selected="false">All</button>
    </nav>

    <main class="grid">
      <section class="card form-card">
        <h2 id="form-title">Add a Task</h2>
        <form id="task-form">
          <input type="hidden" id="task-id" />

          <label class="field">
            Title
            <input id="title" type="text" placeholder="e.g. Draft Q3 launch plan" required />
          </label>

          <div class="row">
            <label class="field">
              Owner
              <input id="owner" type="text" placeholder="Your name or teammate" required list="known-owners" />
              <datalist id="known-owners"></datalist>
            </label>

            <label class="field">
              Scope
              <select id="scope" required>
                <option value="mine">Personal</option>
                <option value="team">Team</option>
              </select>
            </label>
          </div>

          <div class="row">
            <label class="field">
              Priority
              <select id="priority" required>
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </label>

            <label class="field">
              Status
              <select id="status" required>
                <option value="open" selected>Open</option>
                <option value="in-progress">In Progress</option>
                <option value="done">Done</option>
              </select>
            </label>

            <label class="field">
              Due Date
              <input id="due" type="date" />
            </label>
          </div>

          <label class="field">
            Notes
            <textarea id="notes" rows="3" placeholder="Context, links, or acceptance criteria."></textarea>
          </label>

          <div class="actions">
            <button type="submit" class="primary" id="submit-btn">Add Task</button>
            <button type="button" class="ghost" id="cancel-edit" hidden>Cancel</button>
            <button type="reset" class="ghost">Clear</button>
          </div>
          <p class="helper" id="form-helper" role="alert"></p>
        </form>
      </section>

      <section class="card list-card">
        <div class="list-header">
          <h2 id="list-title">My Tasks</h2>
          <div class="filters">
            <input id="search" type="search" placeholder="Search title, owner, notes…" />
            <select id="filter-status">
              <option value="">All statuses</option>
              <option value="open">Open</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Done</option>
            </select>
            <select id="filter-priority">
              <option value="">All priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
            <select id="sort">
              <option value="due">Sort: Due date</option>
              <option value="priority">Sort: Priority</option>
              <option value="created">Sort: Newest</option>
            </select>
          </div>
        </div>

        <ul id="task-list" class="task-list"></ul>
        <p class="empty" id="empty-state">No tasks yet. Add one to get started.</p>
      </section>
    </main>

    <footer class="footer">
      <p>Saved locally in your browser. <button class="link" id="export-btn" type="button">Export JSON</button> · <button class="link" id="import-btn" type="button">Import JSON</button> · <button class="link danger-link" id="clear-all" type="button">Clear all tasks</button></p>
      <input type="file" id="import-file" accept="application/json" hidden />
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
